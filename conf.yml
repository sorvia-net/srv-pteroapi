# Blueprint eklenti tanimi.
#
# Dikkat edilecek uc sey (ucu de ilk kurulumda hata verdi):
#
#   1. "info.target" **Blueprint surumu**, Pterodactyl surumu degil.
#      1.11.11 yazmak "beta-2026-06 ile uyumsuz" uyarisi uretiyordu.
#   2. Burada yazilan her yol bundle icinde **gercekten var olmali**.
#      Bos bir klasor git ve zip icinde hayatta kalmaz; olmayan yol
#      "points towards one or more files that do not exist" ile
#      kurulumu komple durdurur. Bu yuzden kullanmadigimiz hicbir
#      anahtar burada bulunmuyor.
#   3. "requests.controllers" birakildi, yerine "requests.app" geldi.

info:
  name: "Sorvia Ptero API"
  identifier: "srvpteroapi"
  description: "Sorvia Command Center icin genisletilmis panel API'si: dugumler, sunucular, konsol, dosyalar ve kurulu Sorvia urunlerinin tespiti."
  version: "1.0.1"
  target: "beta-2026-06"
  author: "Sorvia <support@sorvia.net>"
  icon: "public/icon.svg"
  website: "https://sorvia.net"

admin:
  view: "admin/index.blade.php"
  controller: "admin/Controller.php"
  css: "admin/style.css"

data:
  public: "public"

requests:
  app: "app"
  routers:
    web: "routers/web.php"
